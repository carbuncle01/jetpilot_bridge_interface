/**:
  ros__parameters:
    ## Prefer a stable /dev/serial/by-id path on the vehicle.
    device: /dev/ttyACM0
    baud_rate: 115200

    ## Host command and safety timeouts.
    command_rate_hz: 100.0
    command_timeout_s: 0.3
    status_timeout_s: 0.5
    reconnect_interval_s: 1.0

    ## AUTO_REQUEST is not sent until a valid board status has been received.
    require_status_for_auto: true

    ## Mirror the physical two-position CH3 selector into JetPilot operation mode.
    ## CH3 low (about 1000us) -> PROPO, high (about 2000us) -> AUTO.
    publish_mode_request: true

    frame_id: jetpilot_bridge
    hardware_id: JPBB-01
