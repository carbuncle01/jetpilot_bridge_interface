/**:
  ros__parameters:
    ## Prefer a stable /dev/serial/by-id path on the vehicle.
    device: /dev/ttyACM0
    baud_rate: 115200

    ## Host command and safety timeouts.
    command_rate_hz: 100.0
    command_timeout_s: 0.2
    status_timeout_s: 0.5
    reconnect_interval_s: 1.0

    ## Host-path steering trim in normalized command units. Joy D-pad right/left
    ## adjusts this value by offset_step while the node is running.
    steering_offset: 0.0
    offset_step: 0.01

    ## Historical parameter name. Both Joy MANUAL and autonomous AUTO use the
    ## host path; keep this true so arming requires fresh, fault-free board status.
    require_status_for_auto: true

    ## CH3 low requests PROPO. CH3 high only permits host control and does not
    ## choose between Joy MANUAL and autonomous AUTO.
    publish_mode_request: true

    frame_id: jetpilot_bridge
    hardware_id: JPBB-01
