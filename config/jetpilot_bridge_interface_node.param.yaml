/**:
  ros__parameters:
    ## Prefer a stable /dev/serial/by-id path on the vehicle.
    device: /dev/ttyACM0
    baud_rate: 115200

    ## Host command and safety timeouts.
    command_rate_hz: 100.0
    command_timeout_s: 0.2
    status_timeout_s: 0.5
    reconnect_interval_s: 1.0

    ## ROS ControlCommand uses positive=left. JPBB-01 hardware uses negative=left,
    ## so invert once at the vehicle boundary for both Joy MANUAL and AUTO.
    steering_scale: -1.0

    ## Host-path steering trim in hardware command units. Joy D-pad right/left
    ## adjusts this value by offset_step while the node is running.
    steering_offset: 0.0
    offset_step: 0.01

    ## Historical parameter name. Both Joy MANUAL and autonomous AUTO use the
    ## host path; keep this true so arming requires fresh, fault-free board status.
    require_status_for_auto: true

    ## CH3 low requests PROPO. CH3 high only permits host control and does not
    ## choose between Joy MANUAL and autonomous AUTO.
    publish_mode_request: true

    ## Publish the selected receiver PWM as the same normalized ControlCommand
    ## contract used by teleop. These values are the inverse of the deployed
    ## host PWM mapping; Futaba trim is adjusted so both neutral values are 1500 us.
    publish_propo_command: true
    propo_frame_id: rc_receiver
    propo_steering_left_us: 1000
    propo_steering_neutral_us: 1500
    propo_steering_right_us: 2000
    propo_throttle_forward_us: 1000
    propo_throttle_neutral_us: 1500
    propo_throttle_reverse_us: 2000

    frame_id: jetpilot_bridge
    hardware_id: JPBB-01
